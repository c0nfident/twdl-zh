<title>twdl visual</title>
<style>
  body { margin: 0; padding: 10px; font: 14px/1.5 system-ui, sans-serif; background: #fff; color: #0f1419; }
  .spacer { height: 6px; }
  [data-testid="cellInnerDiv"] { border: 1px solid #e1e8ed; border-radius: 8px; padding: 10px; margin: 10px 0; max-width: 620px; }
  [data-testid="User-Name"] a { text-decoration: none; color: #0f1419; font-weight: 600; }
  [data-testid="tweetPhoto"] img { max-width: 300px; border-radius: 12px; display: block; margin-top: 6px; }
  .caption { color: #536471; font-size: 12px; margin-bottom: 2px; }
</style>
<script>
(function () {
  function pixels(w, h, a, b, label) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, a); g.addColorStop(1, b);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = '#fff'; x.font = 'bold 28px sans-serif'; x.fillText(label, 16, h / 2 + 10);
    return c.toDataURL('image/png');
  }
  window.__TWDL_TEST_PIXELS = { media: pixels(600, 400, '#e0245e', '#1d9bf0', 'MEDIA'), avatar: pixels(120, 120, '#ffd166', '#06d6a0', 'AVA') };
})();
</script>
</head>
